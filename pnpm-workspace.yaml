autoInstallPeers: false
minimumReleaseAgeExclude:
  - nitro-better-auth@0.3.1 || 0.4.0

shamefullyHoist: true
shellEmulator: true
strictPeerDependencies: false
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 432000

packages:
  - ./
  - ./playground

allowBuilds:
  esbuild: true
  unrs-resolver: true
